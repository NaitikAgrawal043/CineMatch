<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Movie Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="navbar">
        <h2><i class="fas fa-film"></i> CineMatch</h2>
        <div class="navbar-links">
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </div>

    <div class="hero">
        <h1>Discover Your Next Favorite Movie</h1>
        <p>Enter a movie you love, and we'll recommend 5 similar masterpieces tailored just for you.</p>

        <div class="search-box">
            <div class="input-container">
                <i class="fas fa-search search-icon"></i>
                <input list="movies" id="movie-input" placeholder="Type a movie name..." autocomplete="off">
                <datalist id="movies">
                    {% for title in movie_list %}
                        <option value="{{ title }}"></option>
                    {% endfor %}
                </datalist>
            </div>
            <button id="search-btn" onclick="fetchRecommendations()">
                <i class="fas fa-magic"></i> Recommend
            </button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Finding the best matches...</p>
        </div>

        <div class="results-grid" id="recommendations"></div>
    </div>

    <footer id="contact">
        <div class="footer-content">
            <p>&copy; 2026 CineMatch. Built with <i class="fas fa-heart"></i> for movie lovers.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>

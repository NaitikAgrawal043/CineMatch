<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
*{box-sizing:border-box}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
    animation:bg 10s infinite alternate;
}

@keyframes bg{
    0%{filter:hue-rotate(0deg)}
    100%{filter:hue-rotate(40deg)}
}

.hearts span{
    position:absolute;
    bottom:-20px;
    font-size:20px;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{transform:translateY(0);opacity:1}
    to{transform:translateY(-110vh);opacity:0}
}

.card{
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.25);
    border-radius:25px;
    padding:45px;
    width:340px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

h1{
    color:#ff2f68;
}

#msg{
    color:#444;
}

.btns{
    margin-top:30px;
    height:130px;
    position:relative;
}

button{
    border:none;
    padding:14px 28px;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    transition:.35s ease;
}

#yes{
    background:linear-gradient(45deg,#ff416c,#ff4b2b);
    color:white;
    box-shadow:0 0 15px #ff4b2b;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#eee;
    position:absolute;
}

.hidden{display:none}

#result img{
    width:100%;
    border-radius:20px;
    margin:15px 0;
}

.confetti{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="hearts"></div>

<canvas class="confetti" id="confetti"></canvas>

<div class="card" id="question">
    <h1>Will you be my Valentine? 💕</h1>
    <p id="msg">Choose wisely 😏</p>

    <div class="btns">
        <button id="yes">YES ❤️</button>
        <button id="no">NO 😜</button>
    </div>
</div>

<div class="card hidden" id="result">
    <h1>I knew it! 🎉</h1>
    <img src="https://i.imgur.com/8Km9tLL.jpg">
    <p>You’re officially my Valentine forever 💖</p>
</div>

<script>
let yesBtn = document.getElementById("yes");
let noBtn = document.getElementById("no");
let msg = document.getElementById("msg");
let scale = 1;

const funnyTexts=[
"Nice try 😜",
"You’re stuck now 😏",
"Just say yes 😂",
"Still no? 😎",
"It’s destiny ❤️"
];

noBtn.addEventListener("mouseover",()=>{
    noBtn.style.left=Math.random()*220+"px";
    noBtn.style.top=Math.random()*90+"px";

    scale+=0.18;
    yesBtn.style.transform=`scale(${scale})`;

    msg.innerText=funnyTexts[Math.floor(Math.random()*funnyTexts.length)];
});

yesBtn.onclick=()=>{
    document.getElementById("question").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    startConfetti();
};

// floating hearts
const hearts=document.querySelector(".hearts");

setInterval(()=>{
    const heart=document.createElement("span");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=3+Math.random()*3+"s";
    hearts.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
},400);


// Confetti effect
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let conf=[];

function startConfetti(){
 for(let i=0;i<250;i++){
  conf.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   r:Math.random()*6+2,
   d:Math.random()*20,
   c:`hsl(${Math.random()*360},100%,50%)`
  });
 }
 animate();
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 conf.forEach(p=>{
  ctx.beginPath();
  ctx.fillStyle=p.c;
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
  p.y+=Math.random()*4+1;
 });
 requestAnimationFrame(animate);
}
</script>

</body>
</html>

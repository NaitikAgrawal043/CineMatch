{% extends "layout.html" %}
{% load static %}

{% block title %}CineMatch — Delete Review{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

            <div class="clean-card-box text-center">
                <h1 class="h5 fw-bold text-dark mb-2">Delete Review?</h1>
                <p class="text-secondary small mb-4">
                    Are you sure you want to permanently delete your review for <strong>"{{ review.movie_name }}"</strong>?
                </p>

                <form method="POST" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <a href="{% url 'review_list' %}" class="btn-action-secondary py-2 px-4">
                        Cancel
                    </a>
                    <button class="btn btn-danger rounded-2 py-2 px-4 fw-medium border-0" type="submit" style="background-color: #dc2626;">
                        Delete
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
